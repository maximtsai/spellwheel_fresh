<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loading Spinner and Locket</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111010;
    }

    body {
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #game-root {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    #game-stage {
      width: min(100vw, 720px);
      height: min(100vh, 1280px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    #loading-spinner,
    #locket {
      display: block;
      object-fit: contain;
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
    }

    #loading-spinner {
      width: 128px;
      height: 128px;
    }

    #locket {
      width: 180px;
      height: 180px;
    }
  </style>
</head>
<body>
  <main id="game-root" aria-label="Loading">
    <div id="game-stage">
      <img id="loading-spinner" alt="Loading" draggable="false">
      <img id="locket" alt="Locket" draggable="false">
    </div>
  </main>
  <noscript>Enable JavaScript to view this project.</noscript>
  <script>
    // gameplay.js logic for locket animation
    (function () {
      'use strict';
      const FALLBACK_LOCKET_URL = 'https://d16qq0o35va7kz.cloudfront.net/images/Google_115566684854967012242/1787307528646_01M0HX94E6EW376TYEDAB3BS3K.locket.webp';
      let locketFrame = 0;
      let locketAngle = 0;
      let locketLastTime = null;

      function assetUrl(assetId, fallbackUrl) {
        try {
          if (window.lib && typeof window.lib.getAsset === 'function') {
            const asset = window.lib.getAsset(assetId);
            if (asset && asset.url) return asset.url;
          }
        } catch (error) {}
        return fallbackUrl;
      }

      function spinLocket(timestamp) {
        const locket = document.getElementById('locket');
        if (!locket) return;
        if (locketLastTime === null) locketLastTime = timestamp;
        const deltaSeconds = Math.min(0.11, Math.max(0, (timestamp - locketLastTime) / 1000));
        locketLastTime = timestamp;
        locketAngle = (locketAngle + deltaSeconds * 360 / 1.8) % 360;
        locket.style.transform = 'rotate(' + locketAngle + 'deg)';
        locketFrame = window.requestAnimationFrame(spinLocket);
      }

      window.startLocketSpin = function startLocketSpin() {
        const locket = document.getElementById('locket');
        if (!locket) return;
        locket.src = assetUrl('locket.webp', FALLBACK_LOCKET_URL);
        locket.onerror = function () {
          if (locket.src !== FALLBACK_LOCKET_URL) locket.src = FALLBACK_LOCKET_URL;
        };
        if (locketFrame) window.cancelAnimationFrame(locketFrame);
        locketLastTime = null;
        locketFrame = window.requestAnimationFrame(spinLocket);
      };
    })();

    // game.js entry point and spinner animation
    (function () {
      'use strict';
      const FALLBACK_SPINNER_URL = 'https://d16qq0o35va7kz.cloudfront.net/images/Google_115566684854967012242/1787307528581_01M0HX94C5C1K5TGZPQZG5K1XN.loading_spinner.png';
      let spinnerFrame = 0;
      let spinnerAngle = 0;
      let spinnerLastTime = null;

      function assetUrl(assetId, fallbackUrl) {
        try {
          if (window.lib && typeof window.lib.getAsset === 'function') {
            const asset = window.lib.getAsset(assetId);
            if (asset && asset.url) return asset.url;
          }
        } catch (error) {}
        return fallbackUrl;
      }

      function spinSpinner(timestamp) {
        const spinner = document.getElementById('loading-spinner');
        if (!spinner) return;
        if (spinnerLastTime === null) spinnerLastTime = timestamp;
        const deltaSeconds = Math.min(0.11, Math.max(0, (timestamp - spinnerLastTime) / 1000));
        spinnerLastTime = timestamp;
        spinnerAngle = (spinnerAngle + deltaSeconds * 360 / 1.4) % 360;
        spinner.style.transform = 'rotate(' + spinnerAngle + 'deg)';
        spinnerFrame = window.requestAnimationFrame(spinSpinner);
      }

      function startSpinner() {
        const spinner = document.getElementById('loading-spinner');
        if (!spinner) return;
        spinner.src = assetUrl('loading_spinner.png', FALLBACK_SPINNER_URL);
        spinner.onerror = function () {
          if (spinner.src !== FALLBACK_SPINNER_URL) spinner.src = FALLBACK_SPINNER_URL;
        };
        if (spinnerFrame) window.cancelAnimationFrame(spinnerFrame);
        spinnerLastTime = null;
        spinnerFrame = window.requestAnimationFrame(spinSpinner);
      }

      function run(mode) {
        startSpinner();
        if (typeof window.startLocketSpin === 'function') {
          window.startLocketSpin();
        }
      }

      window.run = run;
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { run('play'); }, { once: true });
      } else {
        run('play');
      }
    })();
  </script>
</body>
</html>
