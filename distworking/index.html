#background {
    margin: 0;
    z-index: -2;
    background-image: none;
    background-color: #000000;
    background-position: center;
    background-size: cover;
    width: 100%;
    height: 100%;
    max-height: 100%;
    animation-duration: 3s;
    opacity: 1;
    animation-iteration-count: 1;
    animation-direction: normal;
    position: absolute;
}
#leftborder {
    margin: 0;
    z-index: -1;
    background-image: url("https://d16qq0o35va7kz.cloudfront.net/images/Google_115566684854967012242/1787307528506_01M0HX949TNWMQ7SNJNTE93NY8.handshield_back.webp");

    background-position: center;
    height: 86px;
    width: 100%;
    opacity: 0;
    left: 0;
    top: calc(50% - 453px);
    animation-duration: 0.6s;
    position: fixed;
    transform: rotate(90deg);
}
#rightborder {
    margin: 0;
    z-index: -1;
    background-image: url("https://d16qq0o35va7kz.cloudfront.net/images/Google_115566684854967012242/1787307528506_01M0HX949TNWMQ7SNJNTE93NY8.handshield_back.webp");

canvas {
